name: CI/CD Pipeline

# 1. Trigger the workflow on pushes to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 2: Checkout the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 3: Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # Step 4: Install dependencies and run tests
    - name: Install Dependencies & Test
      run: |
        npm install
        npm test

    # Step 5: Log in to Docker Hub using GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Build and Push Docker Image to Docker Hub
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/nodejs-demo-app:latest